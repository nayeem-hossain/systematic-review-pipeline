[project]
name = "systematic-review-pipeline"
version = "1.2.4"
description = "A guided, auditable systematic-literature-review pipeline: search, dedup, screen, extract, appraise, and report against PRISMA 2020."
readme = "README.md"
requires-python = ">=3.10"
# Covers the Python source (slr.py, srp/, scripts/) only -- README.md and
# examples/README.md are separately licensed under CC-BY-4.0; see LICENSE-docs
# and the README's own "## License" section for the split and why.
license = {file = "LICENSE"}
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "rapidfuzz>=3.6",
    "matplotlib>=3.6",
    "questionary>=2.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/nayeem-hossain/systematic-review-pipeline"
Changelog = "https://github.com/nayeem-hossain/systematic-review-pipeline/blob/main/CHANGELOG.md"

# `slr` launches the same guided TUI as `python slr.py` -- installing it via
# pip/pipx is a convenience for finding and updating the tool, not a reason to
# hide it: `scripts/<stage>.py` remain individually readable and directly
# runnable (`python scripts/search.py --help`) from the installed package or
# a plain git clone, exactly as before. Nothing about this entry point stops
# anyone from opening and reading the script that's actually running.
[project.scripts]
slr = "slr:main"

[tool.setuptools]
packages = ["srp", "scripts"]
py-modules = ["slr"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
